app = "studio404"
primary_region = "fra"

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  PUBLIC_URL = "https://studio404.fly.dev"
  DAILY_BUDGET_USD = "8"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[mounts]]
  source = "studio404_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
